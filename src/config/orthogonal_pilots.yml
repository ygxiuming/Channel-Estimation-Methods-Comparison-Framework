# 正交导频 + 大训练池对照实验

# 研究问题：
# 1. 正交导频（DFT）对 LS 噪声协方差的"白化"作用能否让 DL 训练更容易收敛？
#    （X·Xᴴ = (n_pilot/n_tx)·I ⇒ LS 误差协方差为白噪声对角阵）
# 2. 训练池从 1e4 扩到 5e4，DL 对 LMMSE 的逼近能提高多少？
#    （平坦独立 Rayleigh 下 LMMSE 即贝叶斯最优，DL 只能逼近、无法超越）
# 对照组：ab_validation.yml（随机导频 + 1e4 池）中的同名模型组合

experiment:
  name: 'orthogonal_pilots'
  description: 'DFT 正交导频 + 5e4 大训练池'
  seed: 42
  use_cuda: true
  save_dir: 'results'
  plot_dir: 'plots'

channel:
  n_tx: 4
  n_rx: 4
  n_pilot: 16
  snr_list: [0, 5, 10, 15, 20, 25, 30]
  n_samples: 50000
  type: 'rayleigh'
  # 正交导频：DFT 结构，X·Xᴴ = 4·I（每符号功率 1/n_tx，与随机导频口径一致）
  pilot_type: 'dft'

data:
  augmentation:
    enabled: false
    methods: ['phase_shift', 'magnitude_scale']
    phase_shift_range: [-3.14159, 3.14159]
    magnitude_scale_range: [0.8, 1.25]
  split:
    train_ratio: 0.7
    val_ratio: 0.15
  loader:
    batch_size: 128
    num_workers: 4
    pin_memory: false

traditional:
  ls:
    regularization: true
    lambda: 0.01
  lmmse:
    correlation_method: 'theoretical'
    noise_var_estimation: 'oracle'

dl:
  input_modes: ['raw_sym', 'ls_refine_x']
  models: ['CNN', 'GRU', 'LmmseNet']

models:
  common:
    learning_rate: 0.001
    dropout: 0.3
  rnn:
    hidden_size: 256
    num_layers: 2
  lstm:
    hidden_size: 256
    num_layers: 2
  gru:
    hidden_size: 256
    num_layers: 2
  hybrid:
    rnn_hidden_size: 256

training:
  epochs: 100
  early_stopping:
    patience: 10

evaluation:
  n_test: 2000
  n_trials: 3
  ber_symbols: 100
  equalizer: 'mmse'
