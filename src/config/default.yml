# 信道估计实验配置文件

# 实验基本设置
experiment:
  # 实验名称，用于保存结果和日志
  name: 'channel_estimation'
  # 实验描述
  description: '信道估计方法比较研究'
  # 随机种子，用于复现实验结果
  seed: 42
  # 是否使用GPU（可用 --device cpu/cuda 覆盖）
  use_cuda: true
  # 结果保存路径
  save_dir: 'results'
  # 结果图保存路径
  plot_dir: 'plots'

# 信道参数设置
channel:
  # 发射天线数量
  n_tx: 4
  # 接收天线数量
  n_rx: 4
  # 导频符号长度（必须 >= n_tx）
  n_pilot: 16
  # SNR扫描列表（dB），每个SNR独立评估
  snr_list: [0, 5, 10, 15, 20, 25, 30]
  # 训练池样本数量（评估测试数据每次独立生成，见 evaluation.n_test）
  n_samples: 10000
  # 信道类型：'rayleigh' 或 'rician'，或 'ofdm_freq_selective'（频选，见下）
  type: 'rayleigh'
  # 导频结构（平坦信道）：'random'（随机QPSK，历史方式）/'dft'/'hadamard'
  # 正交导频满足 X·Xᴴ = (n_pilot/n_tx)·I，每符号功率与随机导频口径一致
  pilot_type: 'random'
  # —— 仅 type='ofdm_freq_selective' 时生效 ——
  # 时域抽头数 L（1 ≤ L ≤ n_pilot）
  n_taps: 4
  # 指数功率时延谱衰减系数：pdp_l ∝ exp(-decay·l)，归一化后 Σpdp=1
  pdp_decay: 0.35
  # 注意：OFDM 模式下 n_pilot 复用为子载波数 N（需为 n_tx 整数倍），
  # 导频自动切换为梳状结构，pilot_type 不再生效
  # Rician K因子（仅在type='rician'时有效）
  rician_k: 1.0

# 数据处理设置
data:
  # 数据增强（物理一致的同步增强，仅作用于训练集；默认关闭）
  augmentation:
    enabled: false
    # 可选: 'phase_shift'（逐样本公共相位）, 'magnitude_scale'（逐样本公共增益）
    methods: ['phase_shift', 'magnitude_scale']
    phase_shift_range: [-3.14159, 3.14159]
    magnitude_scale_range: [0.8, 1.25]

  # 数据集划分（评估用测试数据独立生成，不使用此处剩余部分）
  split:
    train_ratio: 0.7
    val_ratio: 0.15

  # 数据加载
  loader:
    batch_size: 128
    num_workers: 0
    pin_memory: false

# 传统估计器设置
traditional:
  ls:
    # 是否使用对角加载正则化
    regularization: true
    lambda: 0.01

  lmmse:
    # 信道相关矩阵估计方法：
    # 'theoretical' —— 独立衰落信道 R_h = I（无数据泄漏，推荐）
    # 'sample'      —— 仅从训练集估计的样本相关矩阵
    correlation_method: 'theoretical'
    # 噪声方差来源：
    # 'oracle' —— 使用数据生成器返回的真实噪声方差（历史默认，结果与旧实验可比）
    # 'blind'  —— 由 LS 残差盲估计（traditional/estimators.estimate_noise_var_blind），
    #             不使用上帝信息，LMMSE 与深度学习方法的先验条件更对齐
    noise_var_estimation: 'oracle'
  # 说明：ML 在线性高斯模型下有闭式解（等价于无正则LS），
  # 噪声方差由数据生成器提供，无需自适应估计

# 深度学习设置
dl:
  # 输入模式（每种模式作为独立实验组分别训练评估）：
  # 'raw'         —— 块拼接（历史方式）：[Re(Y)|Im(Y)|Re(X)|Im(X)] 四大块顺序展平。
  #                  缺陷：CNN 卷积/RNN 切分的局部感受野局限在"同一块内部"，
  #                  看不到 (y,x) 配对，难以学习 H≈Y·X⁻¹ 的乘性结构
  # 'raw_sym'     —— 按导频符号重排（推荐）：每个时间步 = 同一导频符号上的
  #                  (y,x) 配对，与 RNN/卷积的时序/局部结构匹配（维度与 'raw' 相同）
  # 'ls_refine'   —— 混合式（历史方式）：仅输入 LS 估计实虚部，网络学习 refine。
  #                  缺陷：看不到导频 X，学不出逐样本噪声协方差相关的最优收缩
  # 'ls_refine_x' —— 混合式 + 导频特征（推荐）：追加 [Re(X),Im(X)]，
  #                  网络由此可学习逐样本噪声协方差 noise_var·(XXᴴ)⁻¹ 的影响
  input_modes: ['raw_sym', 'ls_refine_x']
  # 参与实验的模型列表（可选 CNN/RNN/LSTM/GRU/Hybrid/LmmseNet 的子集；
  # LmmseNet 仅在 ls_refine_x 模式下参与，其余模式自动跳过）
  models: ['CNN', 'RNN', 'LSTM', 'GRU', 'Hybrid', 'LmmseNet']

# 深度学习模型结构参数
models:
  common:
    learning_rate: 0.001
    dropout: 0.3

  rnn:
    hidden_size: 256
    num_layers: 2

  lstm:
    hidden_size: 256
    num_layers: 2

  gru:
    hidden_size: 256
    num_layers: 2

  hybrid:
    rnn_hidden_size: 256

# 训练设置
training:
  epochs: 100
  early_stopping:
    patience: 10

# 评估设置
evaluation:
  # 每个 (SNR, trial) 独立生成的测试样本数
  n_test: 2000
  # Monte Carlo 重复次数（报告均值±标准差）
  n_trials: 3
  # BER仿真中每个样本每根天线发送的QPSK符号数
  ber_symbols: 100
  # BER仿真均衡方式：'zf' 或 'mmse'
  equalizer: 'mmse'
