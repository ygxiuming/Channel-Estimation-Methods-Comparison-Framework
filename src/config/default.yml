# 信道估计实验配置文件

# 实验基本设置
experiment:
  # 实验名称，用于保存结果和日志
  name: 'channel_estimation'
  # 实验描述
  description: '信道估计方法比较研究'
  # 随机种子，用于复现实验结果
  seed: 42
  # 是否使用GPU（可用 --device cpu/cuda 覆盖）
  use_cuda: true
  # 结果保存路径
  save_dir: 'results'
  # 结果图保存路径
  plot_dir: 'plots'

# 信道参数设置
channel:
  # 发射天线数量
  n_tx: 4
  # 接收天线数量
  n_rx: 4
  # 导频符号长度（必须 >= n_tx）
  n_pilot: 16
  # SNR扫描列表（dB），每个SNR独立评估
  snr_list: [0, 5, 10, 15, 20, 25, 30]
  # 训练池样本数量（评估测试数据每次独立生成，见 evaluation.n_test）
  n_samples: 10000
  # 信道类型：'rayleigh' 或 'rician'
  type: 'rayleigh'
  # Rician K因子（仅在type='rician'时有效）
  rician_k: 1.0

# 数据处理设置
data:
  # 数据增强（物理一致的同步增强，仅作用于训练集；默认关闭）
  augmentation:
    enabled: false
    # 可选: 'phase_shift'（逐样本公共相位）, 'magnitude_scale'（逐样本公共增益）
    methods: ['phase_shift', 'magnitude_scale']
    phase_shift_range: [-3.14159, 3.14159]
    magnitude_scale_range: [0.8, 1.25]

  # 数据集划分（评估用测试数据独立生成，不使用此处剩余部分）
  split:
    train_ratio: 0.7
    val_ratio: 0.15

  # 数据加载
  loader:
    batch_size: 128
    num_workers: 0
    pin_memory: false

# 传统估计器设置
traditional:
  ls:
    # 是否使用对角加载正则化
    regularization: true
    lambda: 0.01

  lmmse:
    # 信道相关矩阵估计方法：
    # 'theoretical' —— 独立衰落信道 R_h = I（无数据泄漏，推荐）
    # 'sample'      —— 仅从训练集估计的样本相关矩阵
    correlation_method: 'theoretical'
  # 说明：ML 在线性高斯模型下有闭式解（等价于无正则LS），
  # 噪声方差由数据生成器提供，无需自适应估计

# 深度学习设置
dl:
  # 输入模式（两种作为独立实验组分别训练评估）：
  # 'raw'       —— 端到端，输入 [Re(Y),Im(Y),Re(X),Im(X)]
  # 'ls_refine' —— 混合式，输入LS估计的实虚部，网络学习refine
  input_modes: ['raw', 'ls_refine']
  # 参与实验的模型列表（可选 CNN/RNN/LSTM/GRU/Hybrid 的子集）
  models: ['CNN', 'RNN', 'LSTM', 'GRU', 'Hybrid']

# 深度学习模型结构参数
models:
  common:
    learning_rate: 0.001
    dropout: 0.3

  rnn:
    hidden_size: 256
    num_layers: 2

  lstm:
    hidden_size: 256
    num_layers: 2

  gru:
    hidden_size: 256
    num_layers: 2

  hybrid:
    rnn_hidden_size: 256

# 训练设置
training:
  epochs: 100
  early_stopping:
    patience: 10

# 评估设置
evaluation:
  # 每个 (SNR, trial) 独立生成的测试样本数
  n_test: 2000
  # Monte Carlo 重复次数（报告均值±标准差）
  n_trials: 3
  # BER仿真中每个样本每根天线发送的QPSK符号数
  ber_symbols: 100
  # BER仿真均衡方式：'zf' 或 'mmse'
  equalizer: 'mmse'
