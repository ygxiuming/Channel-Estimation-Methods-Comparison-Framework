[project]
name = "channel-estimation-comparison"
version = "0.2.0"
description = "MIMO 信道估计方法对比实验框架：传统方法（LS/LMMSE/ML）与深度学习方法（CNN/RNN/LSTM/GRU/Hybrid）的严格公平对比"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "修明", email = "lzmpt@qq.com" }]
dependencies = [
    "numpy>=1.21.0",
    "torch>=1.9.0",
    "matplotlib>=3.4.0",
    "pyyaml>=5.4.0",
    "tqdm>=4.61.0",
    "tensorboard>=2.6.0",
]

[dependency-groups]
dev = [
    "pytest>=6.2.0",
    "black>=21.5b2",
    "flake8>=3.9.0",
    "mypy>=0.910",
]

# 国内镜像加速：默认索引指向清华 TUNA（无需代理；如需还原官方源删除此段即可）
[[tool.uv.index]]
name = "pypi-tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
